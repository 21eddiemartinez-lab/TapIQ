<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TapIQ Water Analysis Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Expanded:wght@600;700;800;900&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════════
       TapIQ — Water Analysis Report (example deliverable)
       Deliberate single "paper" theme: a document, not an app.
       Type: Plus Jakarta Sans (text) + IBM Plex Mono (measured data)
    ═══════════════════════════════════════════════════════════════ */
    :root {
      /* Bold Utilitarian — ink on bone, deep teal, flat status colors */
      --ink:      #101010;
      --ink-soft: #2E2E2A;
      --muted:    #6A685E;
      --faint:    #96938A;
      --line:     #101010;   /* hard borders */
      --line-2:   #D8D6CC;   /* soft dividers */
      --paper-bg: #DAD8CC;   /* page ground behind the doc */
      --card:     #FCFBF7;
      --wash:     #EEECE2;   /* inset panels */

      --sky:      #007A6C;   /* brand teal (accent) */
      --sky-dk:   #005C51;
      --navy:     #101010;   /* dark panels */
      --orange:   #E4572E;

      /* semantic status — flat, high-contrast */
      --good:     #0F7A3D;  --good-bg:  #DDF3E3;  --good-line:#0F7A3D;
      --watch:    #A65A0B;  --watch-bg: #FBEBCF;  --watch-line:#A65A0B;
      --action:   #B4231C;  --action-bg:#F8DCDA;  --action-line:#B4231C;

      --f:    'Archivo', system-ui, -apple-system, sans-serif;
      --disp: 'Archivo Expanded', 'Archivo', system-ui, sans-serif;
      --cond: 'Archivo Narrow', 'Archivo', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
      --r: 0; --r-sm: 0;
      --sh: 6px 6px 0 var(--ink);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--f);
      background: var(--paper-bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* ── Demo control bar (not part of the printed report) ─────────── */
    .demo-bar {
      position: sticky; top: 0; z-index: 50;
      background: var(--ink);
      border-bottom: 2px solid #34D9C4;
    }
    .demo-inner {
      max-width: 900px; margin: 0 auto;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 24px; flex-wrap: wrap;
    }
    .demo-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--disp); font-weight: 900; font-size: 1.05rem; color: #fff; letter-spacing: -.02em;
      margin-right: auto;
    }
    .demo-brand span { color: #34D9C4; }
    .demo-mark {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      background: var(--sky); border: 2px solid #fff;
    }
    .demo-tag {
      font-family: var(--cond); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.5); align-self: center;
    }
    .tabs { display: flex; gap: 6px; }
    .tab {
      cursor: pointer; font-family: var(--cond);
      font-size: .8rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      color: rgba(255,255,255,.7); background: transparent;
      border: 2px solid rgba(255,255,255,.3);
      padding: 7px 13px; transition: all .12s; white-space: nowrap;
    }
    .tab:hover { color: #fff; border-color: #fff; }
    .tab.active { background: var(--sky); color: #fff; border-color: #fff; }
    .print-btn {
      display: inline-flex; align-items: center; gap: 7px;
      border: 2px solid #fff; background: transparent;
      color: #fff; cursor: pointer; font-family: var(--cond);
      font-size: .8rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      padding: 7px 13px; transition: background .12s, color .12s;
    }
    .print-btn:hover { background: #fff; color: var(--ink); }

    /* ── Document shell ───────────────────────────────────────────── */
    .doc {
      max-width: 900px; margin: 40px auto; background: var(--card);
      border: 2px solid var(--ink); box-shadow: var(--sh);
      overflow: hidden;
      animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Masthead */
    .mast {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 32px 40px 26px;
      border-bottom: 2px solid var(--ink);
      background: var(--ink);
    }
    .mast * { color: var(--card); }
    .mast-logo { display: flex; align-items: center; gap: 12px; }
    .mast-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      background: var(--sky); border: 2px solid var(--card);
    }
    .mast-name { font-family: var(--disp); font-size: 1.4rem; font-weight: 900; letter-spacing: -.02em; color: var(--card); }
    .mast-name span { color: #34D9C4; }
    .mast-kicker { font-size: .72rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin-top: 1px; }
    .mast-meta { text-align: right; font-size: .78rem; color: var(--muted); line-height: 1.7; }
    .mast-meta b { color: var(--ink); font-weight: 700; }

    .pad { padding: 30px 44px; }
    .rule { height: 1px; background: var(--line-2); margin: 4px 44px; }

    /* Title block */
    .titleblock { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .doc-title { font-family: var(--disp); font-size: 1.8rem; font-weight: 900; letter-spacing: -.02em; line-height: 1.02; text-wrap: balance; }
    .doc-sub { color: var(--muted); font-size: .9rem; margin-top: 6px; }
    .tier-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--cond); font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 7px 14px; border: 2px solid var(--ink);
      background: var(--ink); color: #fff; white-space: nowrap;
    }
    .tier-badge .dot { width: 7px; height: 7px; background: #34D9C4; }

    /* Customer meta grid */
    .meta-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
      background: var(--ink); border: 2px solid var(--ink);
      overflow: hidden; margin-top: 24px;
    }
    .meta-cell { background: var(--card); padding: 14px 16px; }
    .meta-cell .k { font-size: .64rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
    .meta-cell .v { font-size: .9rem; font-weight: 600; color: var(--ink); margin-top: 3px; }

    /* Verdict banner */
    .verdict {
      display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center;
      padding: 24px 26px 24px 30px; position: relative; overflow: hidden;
      border: 2px solid var(--ink);
    }
    .verdict::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; }
    .verdict.good::before   { background: var(--good); }
    .verdict.watch::before  { background: var(--watch); }
    .verdict.action::before { background: var(--action); }
    .verdict.good   { background: var(--good-bg); }
    .verdict.watch  { background: var(--watch-bg); }
    .verdict.action { background: var(--action-bg); }
    .v-score {
      width: 92px; height: 92px; display: grid; place-items: center;
      background: var(--card); border: 2px solid var(--ink); box-shadow: var(--sh) ; flex-shrink: 0; text-align: center;
    }
    .v-score .num { font-family: var(--disp); font-size: 2rem; font-weight: 900; line-height: 1; }
    .v-score .of  { font-family: var(--cond); font-size: .6rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; margin-top: 3px; }
    .verdict.good   .v-score .num { color: var(--good); }
    .verdict.watch  .v-score .num { color: var(--watch); }
    .verdict.action .v-score .num { color: var(--action); }
    .v-head { font-family: var(--disp); font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; line-height: 1.15; color: var(--ink); }
    .v-body { font-size: .9rem; color: var(--ink-soft); max-width: 52ch; }
    .v-action { text-align: right; flex-shrink: 0; }
    .v-action .lbl { font-family: var(--cond); font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
    .v-action .pill {
      display: inline-block; font-weight: 800; font-size: .88rem; color: #fff;
      background: var(--ink); border: 2px solid var(--ink); padding: 8px 14px;
    }

    /* Section heading */
    .sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .sec-num {
      font-family: var(--mono); font-size: .74rem; font-weight: 600; color: #fff; background: var(--ink);
      border: 2px solid var(--ink); padding: 3px 8px;
    }
    .sec-title { font-family: var(--disp); font-size: 1.05rem; font-weight: 800; letter-spacing: -.01em; }
    .sec-desc { font-size: .82rem; color: var(--muted); margin: -10px 0 20px; }

    /* Glance tiles */
    .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .g-tile { background: var(--wash); border: 2px solid var(--ink); padding: 16px; }
    .g-tile .k { font-family: var(--cond); font-size: .66rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
    .g-tile .v { font-family: var(--disp); font-size: 1rem; font-weight: 800; margin-top: 7px; letter-spacing: -.01em; }
    .g-tile .v.mono { font-family: var(--mono); font-size: 1.15rem; }

    /* Bottled-water savings band */
    .savings {
      display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center;
      background: var(--sky); color: #fff; border: 2px solid var(--ink);
      box-shadow: var(--sh); padding: 26px 30px;
    }
    .sv-label { font-family: var(--cond); font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.7); margin-bottom: 8px; }
    .sv-head { font-family: var(--disp); font-size: 1.35rem; font-weight: 900; letter-spacing: -.01em; line-height: 1.05; margin-bottom: 10px; }
    .sv-body { font-size: .9rem; color: rgba(255,255,255,.9); max-width: 48ch; line-height: 1.5; }
    .sv-body b { color: #fff; background: rgba(0,0,0,.22); padding: 0 4px; }
    .sv-figure { text-align: right; flex-shrink: 0; border-left: 2px solid rgba(255,255,255,.35); padding-left: 28px; }
    .sv-k { font-family: var(--cond); font-size: .66rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.7); }
    .sv-num { font-family: var(--disp); font-size: 2.7rem; font-weight: 900; line-height: 1; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
    .sv-num span { font-family: var(--f); font-size: 1rem; font-weight: 600; color: rgba(255,255,255,.75); }
    .sv-pay { display: inline-block; font-family: var(--cond); font-size: .74rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; background: var(--ink); color: #fff; border: 2px solid var(--ink); padding: 4px 10px; }

    /* Measurement rows */
    .m-row {
      display: grid; grid-template-columns: 1.6fr 1fr 2fr auto; gap: 18px; align-items: center;
      padding: 15px 0; border-top: 1px solid var(--line-2);
    }
    .m-row:first-of-type { border-top: none; }
    .m-name { font-weight: 700; font-size: .92rem; }
    .m-name small { display: block; font-weight: 500; font-size: .74rem; color: var(--muted); margin-top: 1px; }
    .m-val { font-family: var(--mono); font-weight: 600; font-size: 1rem; }
    .m-val .u { font-size: .72rem; color: var(--muted); margin-left: 2px; }
    .m-bar-wrap { display: flex; flex-direction: column; gap: 5px; }
    .m-track { height: 10px; background: var(--card); border: 2px solid var(--ink); position: relative; overflow: hidden; }
    .m-fill { position: absolute; left: 0; top: 0; bottom: 0; }
    .m-fill.good   { background: var(--good); }
    .m-fill.watch  { background: var(--watch); }
    .m-fill.action { background: var(--action); }
    .m-range { display: flex; justify-content: space-between; font-size: .68rem; color: var(--faint); font-family: var(--mono); }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; justify-self: end;
      font-family: var(--cond); font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 10px; white-space: nowrap; border: 2px solid var(--ink);
    }
    .pill.good   { color: var(--good);   background: var(--good-bg); }
    .pill.watch  { color: var(--watch);  background: var(--watch-bg); }
    .pill.action { color: var(--action); background: var(--action-bg); }
    .pill .pdot { width: 7px; height: 7px; background: currentColor; }

    /* Lab table */
    .labwrap { overflow-x: auto; border: 2px solid var(--ink); }
    table.lab { width: 100%; border-collapse: collapse; font-size: .84rem; min-width: 520px; }
    table.lab thead th {
      text-align: left; font-family: var(--cond); font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: #fff; padding: 11px 16px; background: var(--ink); border-bottom: 2px solid var(--ink);
    }
    table.lab thead th.r, table.lab td.r { text-align: right; }
    table.lab td { padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
    table.lab tbody tr:last-child td { border-bottom: none; }
    table.lab td.name { font-weight: 700; }
    table.lab td.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    .lab-note {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: .8rem; color: var(--ink-soft); background: var(--wash);
      border: 2px solid var(--ink); border-left: 6px solid var(--sky);
      padding: 13px 16px; margin-top: 16px;
    }
    .lab-note svg { flex-shrink: 0; color: var(--sky); margin-top: 1px; }

    /* Recommendation */
    .reco {
      display: grid; grid-template-columns: 1.3fr 1fr; gap: 0;
      border: 2px solid var(--ink); overflow: hidden;
    }
    .reco-main { padding: 26px 28px; }
    .reco-eyebrow { font-family: var(--cond); font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); margin-bottom: 9px; }
    .reco-title { font-family: var(--disp); font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 8px; line-height: 1.1; }
    .reco-desc { font-size: .88rem; color: var(--ink-soft); margin-bottom: 18px; }
    .reco-list { display: flex; flex-direction: column; gap: 9px; }
    .reco-list li { list-style: none; display: flex; gap: 10px; align-items: flex-start; font-size: .86rem; color: var(--ink-soft); }
    .reco-check {
      width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
      background: var(--sky); color: #fff; border: 2px solid var(--ink); display: grid; place-items: center;
    }
    .reco-side {
      background: var(--ink); color: #fff; padding: 26px 28px;
      display: flex; flex-direction: column; justify-content: center; gap: 18px;
      position: relative; overflow: hidden; border-left: 2px solid var(--ink);
    }
    .reco-side .k { font-family: var(--cond); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.55); position: relative; }
    .reco-cost { font-family: var(--disp); font-size: 2rem; font-weight: 900; letter-spacing: -.01em; line-height: 1; position: relative; }
    .reco-cost small { font-family: var(--f); font-size: .8rem; font-weight: 500; color: rgba(255,255,255,.6); }
    .reco-credit {
      position: relative; font-size: .82rem; color: #fff;
      background: rgba(0,122,108,.25); border: 2px solid var(--sky);
      padding: 11px 13px; line-height: 1.45;
    }
    .reco-credit b { color: #34D9C4; }

    /* Plain-English notes */
    .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .note { background: var(--wash); border: 2px solid var(--ink); padding: 16px 18px; }
    .note h4 { font-family: var(--disp); font-size: .9rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .note h4 .ic { color: var(--sky); display: inline-grid; }
    .note p { font-size: .83rem; color: var(--ink-soft); }

    /* Next steps */
    .steps { counter-reset: s; display: flex; flex-direction: column; gap: 12px; }
    .step { display: flex; gap: 14px; align-items: flex-start; }
    .step .n {
      counter-increment: s; flex-shrink: 0;
      width: 30px; height: 30px; background: var(--sky); color: #fff; border: 2px solid var(--ink);
      font-family: var(--disp); font-weight: 800; font-size: .85rem; display: grid; place-items: center;
    }
    .step .n::before { content: counter(s); }
    .step .t { font-size: .89rem; color: var(--ink-soft); padding-top: 4px; }
    .step .t b { color: var(--ink); }

    /* Disclaimer + footer */
    .disc {
      font-size: .78rem; color: var(--muted); line-height: 1.6;
      background: var(--wash); border: 2px solid var(--ink); border-left: 6px solid var(--sky); padding: 16px 18px;
    }
    .disc b { color: var(--ink); }
    .doc-foot {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
      padding: 22px 40px; border-top: 2px solid var(--ink); background: var(--ink);
      font-family: var(--cond); font-size: .82rem; color: rgba(255,255,255,.55);
    }
    .doc-foot .contact { display: flex; gap: 18px; flex-wrap: wrap; }
    .doc-foot, .doc-foot * { color: rgba(255,255,255,.6); }
    .doc-foot a { color: #34D9C4; font-weight: 600; }

    /* Responsive */
    @media (max-width: 760px) {
      .pad { padding: 24px 22px; }
      .mast { padding: 24px 22px 20px; }
      .rule { margin: 4px 22px; }
      .doc-foot { padding: 20px 22px; }
      .meta-grid { grid-template-columns: 1fr 1fr; }
      .glance { grid-template-columns: 1fr 1fr; }
      .verdict { grid-template-columns: 1fr; text-align: left; }
      .v-action { text-align: left; }
      .savings { grid-template-columns: 1fr; gap: 18px; }
      .sv-figure { text-align: left; border-left: none; padding-left: 0; border-top: 2px solid rgba(255,255,255,.35); padding-top: 16px; }
      .reco { grid-template-columns: 1fr; }
      .notes { grid-template-columns: 1fr; }
      .m-row { grid-template-columns: 1fr auto; grid-template-areas: "name pill" "val val" "bar bar"; gap: 8px 12px; }
      .m-name { grid-area: name; } .pill { grid-area: pill; } .m-val { grid-area: val; } .m-bar-wrap { grid-area: bar; }
      .doc-title { font-size: 1.5rem; }
    }

    /* Print */
    @media print {
      body { background: #fff; padding: 0; }
      .demo-bar { display: none; }
      .doc { box-shadow: none; margin: 0; max-width: none; border: none; animation: none; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<!-- Demo control bar (excluded from print) -->
<div class="demo-bar">
  <div class="demo-inner">
    <div class="demo-brand">
      <span class="demo-mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0014 0C19 10 12 2.5 12 2.5z"/><path d="M9 15a3 3 0 003 3"/></svg>
      </span>
      Tap<span>IQ</span>
    </div>
    <span class="demo-tag">Example report</span>
    <div class="tabs" id="tabs"></div>
    <button class="print-btn" onclick="window.print()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Save PDF
    </button>
  </div>
</div>

<main id="doc"></main>

<script>
  /* ════════════════════════════════════════════════════════════════
     REPORT DATA — one object per package tier.
     Edit values / copy here; the template below renders them.
  ════════════════════════════════════════════════════════════════ */
  const CUSTOMER = {
    name: 'Maria & Luis Reyes',
    address: 'North Park, San Diego, CA 92104',
    source: 'Kitchen cold tap',
    tech: 'TapIQ Field Technician',
  };

  const ICONS = {
    info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',

          <div class="m-range"><span>${m.lo}</span><span>typical ≤ ${m.hi}</span></div>
        </div>
        <span class="pill ${m.status}"><span class="pdot"></span>${m.label}</span>
      </div>`;
  }

            <thead><tr>
              <th>Analyte</th><th class="r">Result</th><th class="r">Action level</th>
              <th>Method</th><th class="r">Status</th>
            </tr></thead>
            <tbody>
              ${lab.rows.map(r => `
                <tr>
                  <td class="name">${r.name}</td>
                  <td class="r mono">${r.result}${r.unit ? ' ' + r.unit : ''}</td>
                  <td class="r mono">${r.limit}</td>
                  <td>${r.method}</td>
                  <td class="r"><span class="pill ${r.status}"><span class="pdot"></span>${r.label}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="lab-note">${ICONS.info}<div>${lab.note}</div></div>
      </div>
      <div class="rule"></div>`;
  }
