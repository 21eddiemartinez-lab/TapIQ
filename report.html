  <style>
    /* ═══════════════════════════════════════════════════════════════

    :root{
      --navy:#0B2440; --ink:#0F2438; --blue:#1668D8; --blue-dk:#0E4FA8; --cyan:#16B6CE;
      --coral:#F2704A;
      --bg:#EEF3F8; --card:#FFFFFF; --wash:#F4F8FC; --line:#E4EBF3;
      --slate:#3C566E; --muted:#6B7E92; --faint:#9AAAB9;
      --good:#118A41; --good-bg:#E3F5EA; --watch:#B26A00; --watch-bg:#FBF0DA; --action:#C62A2A; --action-bg:#FBE4E4;
      --f:'DM Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
      --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:24px;

    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:60px;}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

    .demo-bar{position:sticky;top:0;z-index:50;background:var(--navy);}
    .demo-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:13px 24px;flex-wrap:wrap;}
    .demo-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:#fff;margin-right:auto;}
    .demo-brand span{color:var(--cyan);}
    .demo-mark{width:30px;height:30px;object-fit:contain;display:block;}
    .demo-tag{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);align-self:center;}
    .tabs{display:flex;gap:5px;background:rgba(255,255,255,.08);padding:5px;border-radius:99px;}
    .tab{cursor:pointer;font-family:var(--f);font-size:.8rem;font-weight:600;color:rgba(255,255,255,.7);background:none;border:none;padding:8px 15px;border-radius:99px;transition:all .15s;white-space:nowrap;}
    .tab:hover{color:#fff;} .tab.active{background:var(--blue);color:#fff;}
    .print-btn{display:inline-flex;align-items:center;gap:7px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-family:var(--f);font-size:.8rem;font-weight:600;padding:9px 15px;border-radius:99px;transition:background .15s;}
    .print-btn:hover{background:rgba(255,255,255,.2);}

    .doc{max-width:900px;margin:32px auto;background:var(--card);border-radius:var(--r-xl);box-shadow:var(--sh-lg);overflow:hidden;animation:rise .5s cubic-bezier(.2,.7,.3,1) both;}
    @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

    .mast{display:flex;justify-content:space-between;align-items:flex-start;padding:34px 44px 30px;background:var(--navy);}
    .mast *{color:#fff;}
    .mast-logo{display:flex;align-items:center;gap:12px;}
    .mast-mark{width:44px;height:44px;object-fit:contain;display:block;}
    .mast-name{font-weight:800;font-size:1.4rem;letter-spacing:-.01em;}
    .mast-name span{color:var(--cyan);}
    .mast-kicker{font-size:.75rem;color:rgba(255,255,255,.55);margin-top:2px;}
    .mast-meta{text-align:right;font-size:.78rem;color:rgba(255,255,255,.6);line-height:1.7;}
    .mast-meta b{color:#fff;font-weight:700;}

    .pad{padding:32px 44px;}
    .rule{height:1px;background:var(--line);margin:0 44px;}

    .titleblock{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
    .doc-title{font-weight:800;font-size:1.8rem;letter-spacing:-.02em;line-height:1.06;color:var(--ink);}
    .doc-sub{color:var(--muted);font-size:.92rem;margin-top:6px;}
    .tier-badge{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;padding:8px 15px;border-radius:99px;background:#E7F0FB;color:var(--blue-dk);white-space:nowrap;}
    .tier-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);}

    .meta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px;}
    .meta-cell{background:var(--wash);border-radius:var(--r);padding:15px 16px;}
    .meta-cell .k{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
    .meta-cell .v{font-size:.9rem;font-weight:600;color:var(--ink);margin-top:4px;}

    .verdict{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:26px 28px;border-radius:var(--r-lg);}
    .verdict.good{background:var(--good-bg);} .verdict.watch{background:var(--watch-bg);} .verdict.action{background:var(--action-bg);}
    .v-score{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);flex-shrink:0;text-align:center;}
    .v-score .num{font-weight:800;font-size:2rem;line-height:1;} .v-score .of{font-size:.6rem;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-top:3px;}
    .verdict.good .v-score .num{color:var(--good);} .verdict.watch .v-score .num{color:var(--watch);} .verdict.action .v-score .num{color:var(--action);}

    .v-body{font-size:.92rem;color:var(--slate);max-width:52ch;}
    .v-action{text-align:right;flex-shrink:0;}
    .v-action .lbl{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
    .v-action .pill{display:inline-block;font-weight:700;font-size:.88rem;color:#fff;background:var(--ink);padding:9px 16px;border-radius:99px;}

    .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
    .sec-num{font-family:var(--mono);font-size:.74rem;font-weight:600;color:#fff;background:var(--blue);border-radius:8px;padding:4px 9px;}
    .sec-title{font-weight:800;font-size:1.12rem;letter-spacing:-.01em;color:var(--ink);}
    .sec-desc{font-size:.86rem;color:var(--muted);margin:-8px 0 20px;}

    .glance{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    .g-tile{background:var(--wash);border-radius:var(--r);padding:18px;}
    .g-tile .k{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}
    .g-tile .v{font-weight:800;font-size:1.05rem;margin-top:6px;color:var(--ink);} .g-tile .v.mono{font-family:var(--mono);font-size:1.15rem;}

    .savings{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:linear-gradient(160deg,var(--blue),var(--blue-dk));color:#fff;border-radius:var(--r-lg);padding:28px 32px;box-shadow:var(--sh);}
    .sv-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75);margin-bottom:8px;}
    .sv-head{font-weight:800;font-size:1.35rem;line-height:1.1;margin-bottom:10px;}
    .sv-body{font-size:.92rem;color:rgba(255,255,255,.9);max-width:48ch;line-height:1.5;} .sv-body b{color:#fff;}
    .sv-figure{text-align:right;flex-shrink:0;}
    .sv-k{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);}
    .sv-num{font-weight:800;font-size:2.6rem;line-height:1;margin:4px 0 10px;} .sv-num span{font-size:1rem;font-weight:600;color:rgba(255,255,255,.75);}
    .sv-pay{display:inline-block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:rgba(255,255,255,.16);color:#fff;padding:6px 13px;border-radius:99px;}

    .m-row{display:grid;grid-template-columns:1.6fr 1fr 2fr auto;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line);}
    .m-row:first-of-type{border-top:none;}
    .m-name{font-weight:700;font-size:.94rem;color:var(--ink);} .m-name small{display:block;font-weight:400;font-size:.76rem;color:var(--muted);margin-top:1px;}
    .m-val{font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--ink);} .m-val .u{font-size:.72rem;color:var(--muted);margin-left:2px;}
    .m-bar-wrap{display:flex;flex-direction:column;gap:6px;}
    .m-track{height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden;}
    .m-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;}
    .m-fill.good{background:var(--good);} .m-fill.watch{background:var(--watch);} .m-fill.action{background:var(--action);}
    .m-range{display:flex;justify-content:space-between;font-size:.7rem;color:var(--faint);font-family:var(--mono);}
    .pill{display:inline-flex;align-items:center;gap:6px;justify-self:end;font-size:.74rem;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap;}
    .pill.good{color:var(--good);background:var(--good-bg);} .pill.watch{color:var(--watch);background:var(--watch-bg);} .pill.action{color:var(--action);background:var(--action-bg);}
    .pill .pdot{width:7px;height:7px;border-radius:50%;background:currentColor;}

    .labwrap{overflow-x:auto;border-radius:var(--r);box-shadow:0 0 0 1px var(--line);}
    table.lab{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px;}
    table.lab thead th{text-align:left;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:13px 16px;background:var(--wash);}
    table.lab thead th.r,table.lab td.r{text-align:right;}
    table.lab td{padding:13px 16px;border-top:1px solid var(--line);color:var(--slate);}
    table.lab td.name{font-weight:700;color:var(--ink);} table.lab td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
    .lab-note{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--slate);background:#E7F0FB;border-radius:var(--r);padding:15px 18px;margin-top:16px;line-height:1.55;}
    .lab-note svg{flex-shrink:0;color:var(--blue);margin-top:1px;}

    .reco{display:grid;grid-template-columns:1.3fr 1fr;gap:0;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 0 0 1px var(--line);}
    .reco-main{padding:28px 30px;background:#fff;}
    .reco-eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:9px;}
    .reco-title{font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin-bottom:8px;color:var(--ink);line-height:1.15;}
    .reco-desc{font-size:.9rem;color:var(--slate);margin-bottom:18px;line-height:1.55;}
    .reco-list{display:flex;flex-direction:column;gap:10px;}

    .reco-check{width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:1px;background:#E7F0FB;color:var(--blue);display:grid;place-items:center;}
    .reco-side{background:linear-gradient(160deg,var(--navy),#091a30);color:#fff;padding:28px 30px;display:flex;flex-direction:column;justify-content:center;gap:18px;}
    .reco-side .k{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);}
    .reco-cost{font-weight:800;font-size:2rem;line-height:1;} .reco-cost small{font-size:.8rem;font-weight:500;color:rgba(255,255,255,.6);}
    .reco-credit{font-size:.82rem;color:#fff;background:rgba(22,182,206,.16);border-radius:var(--r-sm);padding:12px 14px;line-height:1.45;} .reco-credit b{color:var(--cyan);}

    .notes{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .note{background:var(--wash);border-radius:var(--r);padding:18px 20px;}
    .note h4{font-weight:700;font-size:.95rem;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
    .note h4 .ic{color:var(--blue);display:inline-grid;} .note p{font-size:.84rem;color:var(--muted);line-height:1.55;}

    .steps{counter-reset:s;display:flex;flex-direction:column;gap:14px;}
    .step{display:flex;gap:14px;align-items:flex-start;}
    .step .n{counter-increment:s;flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;}
    .step .n::before{content:counter(s);}
    .step .t{font-size:.9rem;color:var(--slate);padding-top:4px;} .step .t b{color:var(--ink);}

    .disc{font-size:.8rem;color:var(--muted);line-height:1.6;background:var(--wash);border-radius:var(--r);padding:18px 20px;} .disc b{color:var(--ink);}
    .doc-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:24px 44px;background:var(--navy);font-size:.82rem;}
    .doc-foot,.doc-foot *{color:rgba(255,255,255,.6);} .doc-foot a{color:var(--cyan);font-weight:600;}
    .doc-foot .contact{display:flex;gap:18px;flex-wrap:wrap;}

    @media (max-width:760px){
      .pad{padding:24px 22px;} .mast{padding:26px 22px 22px;} .rule{margin:0 22px;} .doc-foot{padding:22px 22px;}
      .meta-grid{grid-template-columns:1fr 1fr;} .glance{grid-template-columns:1fr 1fr;}
      .verdict{grid-template-columns:1fr;text-align:left;} .v-action{text-align:left;}
      .savings{grid-template-columns:1fr;gap:18px;} .sv-figure{text-align:left;}
      .reco{grid-template-columns:1fr;} .notes{grid-template-columns:1fr;}
      .m-row{grid-template-columns:1fr auto;grid-template-areas:"name pill" "val val" "bar bar";gap:8px 12px;}
      .m-name{grid-area:name;} .pill{grid-area:pill;} .m-val{grid-area:val;} .m-bar-wrap{grid-area:bar;}
      .doc-title{font-size:1.5rem;}
    }
    @media print{
      body{background:#fff;padding:0;} .demo-bar{display:none;}
      .doc{box-shadow:none;margin:0;max-width:none;border-radius:0;animation:none;}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }
  </style>
</head>

  /* ── Render ─────────────────────────────────────────────────────── */
  function metricRow(m) {
    return `
      <div class="m-row">
        <div class="m-name">${m.name}<small>${m.note}</small></div>
        <div class="m-val">${m.val}<span class="u">${m.unit}</span></div>
        <div class="m-bar-wrap">
          <div class="m-track"><div class="m-fill ${m.status}" style="width:${m.fill}%"></div></div>
          <div class="m-range"><span>${m.lo}</span><span>typical &le; ${m.hi}</span></div>
        </div>
        <span class="pill ${m.status}"><span class="pdot"></span>${m.label}</span>
      </div>`;
  }

  function labSection(lab, n) {
    if (!lab) return '';
    return `
      <div class="pad">
        <div class="sec-head"><span class="sec-num">${n}</span><span class="sec-title">${lab.title}</span></div>
        <p class="sec-desc">${lab.desc}</p>
        <div class="labwrap">
          <table class="lab">
            <thead><tr>
              <th>Analyte</th><th class="r">Result</th><th class="r">Action level</th>
              <th>Method</th><th class="r">Status</th>
            </tr></thead>
            <tbody>
              ${lab.rows.map(r => `
                <tr>
                  <td class="name">${r.name}</td>
                  <td class="r mono">${r.result}${r.unit ? ' ' + r.unit : ''}</td>
                  <td class="r mono">${r.limit}</td>
                  <td>${r.method}</td>
                  <td class="r"><span class="pill ${r.status}"><span class="pdot"></span>${r.label}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="lab-note">${ICONS.info}<div>${lab.note}</div></div>
      </div>
      <div class="rule"></div>`;
  }

  function render(key) {
    const r = REPORTS[key];
    const hasLab = !!r.lab;
    let n = 0; const num = () => String(++n).padStart(2, '0');

    document.getElementById('doc').innerHTML = `
      <article class="doc">
        <!-- Masthead -->
        <div class="mast">
          <div class="mast-logo">
            <img src="assets/tapiq-mark.png" alt="TapIQ" class="mast-mark" />

              <div class="mast-kicker">Test your tap. Find your filter.</div>
            </div>
          </div>
          <div class="mast-meta">
            <div>Report <b>${r.id}</b></div>
            <div>Issued <b>${r.date}</b></div>
            <div>San Diego County</div>
          </div>
        </div>

        <!-- Title + customer -->
        <div class="pad">
          <div class="titleblock">
            <div>
              <div class="doc-title">${r.title}</div>
              <div class="doc-sub">${r.sub}</div>
            </div>
            <div class="tier-badge"><span class="dot"></span>${r.tier}</div>
          </div>
          <div class="meta-grid">
            <div class="meta-cell"><div class="k">Prepared for</div><div class="v">${CUSTOMER.name}</div></div>
            <div class="meta-cell"><div class="k">Location</div><div class="v">${CUSTOMER.address}</div></div>
            <div class="meta-cell"><div class="k">Sample source</div><div class="v">${CUSTOMER.source}</div></div>
            <div class="meta-cell"><div class="k">Collected by</div><div class="v">${CUSTOMER.tech}</div></div>
          </div>
        </div>
        <div class="rule"></div>

        <!-- Verdict -->
        <div class="pad">
          <div class="verdict ${r.verdict.status}">
            <div class="v-score"><div class="num">${r.verdict.score}</div><div class="of">RATING</div></div>
            <div>
              <div class="v-head">${r.verdict.head}</div>
              <div class="v-body">${r.verdict.body}</div>
            </div>
            <div class="v-action">
              <div class="lbl">Recommended</div>
              <div class="pill">${r.verdict.action}</div>
            </div>
          </div>
        </div>
        <div class="rule"></div>

        <div class="pad">

            </div>
            <div class="sv-figure">
              <div class="sv-k">Estimated savings</div>
              <div class="sv-num">${r.savings.netYear}<span>/yr</span></div>
              <div class="sv-pay">Pays for itself in ${r.savings.payback}</div>
            </div>
          </div>
        </div>
        <div class="rule"></div>

        <!-- Measurements -->
        <div class="pad">
          <div class="sec-head"><span class="sec-num">${num()}</span><span class="sec-title">On-site measurements</span></div>
          <p class="sec-desc">Field-screened at your tap. Bars show where your result sits against typical drinking-water ranges.</p>
          ${r.metrics.map(metricRow).join('')}
        </div>
        <div class="rule"></div>

        ${hasLab ? labSection(r.lab, num()) : ''}

        <!-- Recommendation -->
        <div class="pad">
          <div class="sec-head"><span class="sec-num">${num()}</span><span class="sec-title">Our recommendation</span></div>
          <div class="reco">
            <div class="reco-main">
              <div class="reco-eyebrow">${r.reco.eyebrow}</div>
              <div class="reco-title">${r.reco.title}</div>
              <div class="reco-desc">${r.reco.desc}</div>
              <ul class="reco-list">
                ${r.reco.list.map(li => `<li><span class="reco-check">${ICONS.check}</span>${li}</li>`).join('')}

            </div>
            <div class="reco-side">

              </div>
              ${r.reco.credit ? `<div class="reco-credit">${r.reco.credit}</div>` : ''}
            </div>
          </div>
        </div>
        <div class="rule"></div>

        <!-- Plain-English notes -->
        <div class="pad">
          <div class="sec-head"><span class="sec-num">${num()}</span><span class="sec-title">What this means for you</span></div>
          <div class="notes">
            ${r.notes.map(nt => `<div class="note"><h4><span class="ic">${ICONS[nt.icon]}</span>${nt.h}</h4><p>${nt.p}</p></div>`).join('')}
          </div>
        </div>
        <div class="rule"></div>

        <!-- Next steps -->
        <div class="pad">
          <div class="sec-head"><span class="sec-num">${num()}</span><span class="sec-title">Next steps</span></div>
          <div class="steps">
            ${r.steps.map(s => `<div class="step"><div class="n"></div><div class="t">${s}</div></div>`).join('')}
          </div>
        </div>
        <div class="rule"></div>

        <!-- Disclaimer -->
        <div class="pad">
          <div class="disc">
            <b>About this report.</b> ${hasLab
              ? 'On-site values are field screening measurements; contaminant values are from third-party certified laboratory testing. Field screening is not a substitute for certified testing and is provided for guidance.'
              : 'Values are field screening measurements, not certified laboratory results. For health-related contaminants such as lead, PFAS, or bacteria, TapIQ recommends third-party certified lab testing (see the Advanced Water Profile).'}
            Recommendations reflect the samples collected on the issue date and your stated household needs.
          </div>
        </div>

        <!-- Footer -->
        <div class="doc-foot">
          <div class="contact">
            <span>hello@tapiqwater.com</span>
            <span>tapiqwater.com</span>
          </div>
          <div>&copy; 2026 TapIQ &middot; Serving San Diego County</div>
        </div>
      </article>`;

    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* Tabs */
  const tabsEl = document.getElementById('tabs');
  Object.entries(REPORTS).forEach(([key, r]) => {
    const b = document.createElement('button');
    b.className = 'tab'; b.dataset.key = key; b.textContent = r.tab;
    b.onclick = () => render(key);
    tabsEl.appendChild(b);
  });

  // Open a specific tier via ?tier=starter|kit|advanced; default to flagship
  const wanted = new URLSearchParams(location.search).get('tier');
  render(REPORTS[wanted] ? wanted : 'kit');
</script>
